name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Backend - Prisma Generate & Push Schema
        run: |
          cd backend
          npx prisma generate
          npx prisma db push

      - name: Backend - Run Automated Test Suite (Section 10)
        run: |
          cd backend
          npm test

      - name: Backend - Type Check & Build
        run: |
          cd backend
          npm run build

      - name: Frontend - Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend - Lint & Type Check
        run: |
          cd frontend
          npm run lint

      - name: Frontend - Production Build
        run: |
          cd frontend
          npm run build
