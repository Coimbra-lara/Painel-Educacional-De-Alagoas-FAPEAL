name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend & Monorepo - Install Dependencies
        run: |
          rm -rf node_modules package-lock.json backend/node_modules backend/package-lock.json frontend/node_modules frontend/package-lock.json
          npm install
          cd backend && rm -rf node_modules package-lock.json && npm install

      - name: Backend - Prisma Generate & Push Schema
        run: |
          cd backend
          npm run prisma:push

      - name: Backend - Run Automated Test Suite (Section 10)
        run: |
          cd backend
          npm test

      - name: Backend - Type Check & Build
        run: |
          cd backend
          npm run build

      - name: Frontend - Lint & Type Check
        run: |
          cd frontend
          npm run lint

      - name: Frontend - Production Build
        run: |
          cd frontend
          npm run build
